name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Docker is the local toolchain only. CI runs natively so the Node version
# matrix is the thing under test, rather than the single version pinned in
# the dev image.
jobs:
  lint:
    name: Lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      # Compiles a sample consumer against the exports map under the strict
      # flags a real consumer uses — the guard that the published type surface
      # is usable, not merely present.
      - run: pnpm run typecheck:fixture
      - run: pnpm run publint
      - run: pnpm run attw
      - run: pnpm run size
      - run: pnpm run audit

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      # Packs the tarball and consumes it from a scratch ESM project and a
      # scratch CJS project, which is the only way the dual-package wiring is
      # exercised the way a user meets it.
      - run: pnpm run smoke

# Three further jobs are planned and deliberately absent until the artifacts
# they run against exist:
#
#   min-peers      each adapter's lowest declared peer range on the Node floor.
#                  Waits on the adapters and their peer ranges.
#   contract-drift compares the checked-in wire contract against the server's
#                  published schema. Waits on the contract layer.
#   fault-matrix   asserts the fail-open invariants across the generated fault
#                  cases, plus the negative control that proves the harness can
#                  fail. Waits on the ping core.

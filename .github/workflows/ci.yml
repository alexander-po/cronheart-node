name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Docker is the local toolchain only. CI runs natively so the Node version
# matrix is the thing under test, rather than the single version pinned in
# the dev image.
jobs:
  lint:
    name: Lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run contract:check
      # Offline against a snapshot committed in the repo: an unreachable service must
      # never be able to turn a pull request red. The live half runs on a schedule.
      - run: pnpm run contract:drift
      - run: pnpm run contract:vectors
      - run: pnpm run typecheck
      # Compiles a sample consumer against the exports map under the strict
      # flags a real consumer uses — the guard that the published type surface
      # is usable, not merely present.
      - run: pnpm run typecheck:fixture
      - run: pnpm run guard
      - run: pnpm run doc-claims
      # The generic half of the leak control. The half that names the private vocabulary
      # cannot live in a public repository, and runs before a push instead.
      - run: pnpm run private-information
      - run: pnpm run publint
      - run: pnpm run attw
      - run: pnpm run size
      - run: pnpm run audit

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      # Packs the tarball and consumes it from a scratch ESM project and a
      # scratch CJS project, which is the only way the dual-package wiring is
      # exercised the way a user meets it.
      - run: pnpm run smoke

  fault-matrix:
    name: Fault matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Asserts the fail-open invariants across every fault, and then asserts that
      # the deliberately unsafe control breaks each of them — a matrix that cannot
      # go red proves nothing.
      - run: pnpm run fault-matrix

  min-peers:
    name: Minimum peers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # The floor in engines, not the newest LTS: an adapter's peer range and the
      # oldest Node the package claims are two promises that have to hold together.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # One step, and the script is what decides which versions those are — a job that
      # listed them here would drift from the ranges the manifest publishes.
      - run: pnpm run min-peers

# The live half of the drift watch is absent on purpose: it fetches, and a fetch that
# fails must not fail a pull request. It runs on a schedule in contract-drift.yml and
# opens a pull request, which is what brings the difference back through this one.
